# HTTP bootstrap configuration; deploy-klx.sh selects the TLS version once a certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name klxluxeplus.poolpay.space;
    root /var/www/klxluxeplus/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Match the original URI only: Nginx internally resolves / to index.html.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 https://klxluxeplus.poolpay.space/$is_args$args;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/klxluxeplus;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
