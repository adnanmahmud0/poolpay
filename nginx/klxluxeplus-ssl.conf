# Separate certificate preserves the existing PoolPay domains and certificates.
server {
    listen 80;
    listen [::]:80;
    server_name klxluxeplus.poolpay.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/klxluxeplus;
    }

    location / { return 301 https://klxluxeplus.poolpay.space$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name klxluxeplus.poolpay.space;

    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/klxluxeplus.poolpay.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klxluxeplus.poolpay.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
