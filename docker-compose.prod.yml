name: poolpay-production

services:
  mongodb:
    image: mongo:7.0
    container_name: poolpay_mongodb_prod
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    env_file:
      - .env
    volumes:
      - mongodb_data_prod:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      # Expose locally to host only
      - "127.0.0.1:27017:27017"
    networks:
      - poolpay-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: poolpay_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    ports:
      # Expose locally to host only
      - "127.0.0.1:6379:6379"
    networks:
      - poolpay-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-${API_IMAGE:-ghcr.io/adnanmahmud0/poolpay-backend:latest}}
    container_name: poolpay_backend_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - IP=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL:-mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD:-PoolPaySecurePass2026!}@mongodb:27017/poolPay-db?authSource=admin}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-8c33e105b5341929104629d4a046d7f8b5d0c4813fd4b731f92788ea157ec633}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-cad41235ea8dc707745041eb76f36dc60fcb0115d9cd4685f32641cb38ac8ff5}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@poolpay.space}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Admin123!}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Super Admin}
    volumes:
      - backend_uploads_prod:/app/uploads
      - backend_logs_prod:/app/logs
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - poolpay-prod-network

  admin:
    image: ${ADMIN_IMAGE:-${WEB_IMAGE:-ghcr.io/adnanmahmud0/poolpay-admin:latest}}
    container_name: poolpay_admin_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://api.poolpay.space}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.poolpay.space/api/v1}
    ports:
      - "127.0.0.1:5001:3000"
    depends_on:
      - backend
    networks:
      - poolpay-prod-network

  klx:
    image: ${KLX_IMAGE:-ghcr.io/adnanmahmud0/poolpay-klx:latest}
    container_name: poolpay_klx_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5002
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=${KLX_DATABASE_URL:-mongodb://admin:password123@mongodb:27017/klx_luxe_plus?authSource=admin}
      - KLX_DATABASE_URL=${KLX_DATABASE_URL:-mongodb://admin:password123@mongodb:27017/klx_luxe_plus?authSource=admin}
      - KLX_DB_NAME=klx_luxe_plus
      - KLX_MEDIA_DIR=/app/media
    volumes:
      - klx_media_prod:/app/media
    ports:
      - "127.0.0.1:5002:5002"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - poolpay-prod-network

volumes:
  mongodb_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  backend_uploads_prod:
    driver: local
  backend_logs_prod:
    driver: local
  klx_media_prod:
    driver: local

networks:
  poolpay-prod-network:
    driver: bridge

