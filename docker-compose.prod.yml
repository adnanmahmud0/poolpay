name: poolpay-production

services:
  mongodb:
    image: mongo:7.0
    container_name: poolpay_mongodb_prod
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-PoolPaySecurePass2026!}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-poolPay-db}
    volumes:
      - mongodb_data_prod:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      # Expose locally to host only (or keep internal)
      - "127.0.0.1:27017:27017"
    networks:
      - poolpay-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: poolpay_api_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-PoolPaySecurePass2026!}@mongodb:27017/${MONGO_INITDB_DATABASE:-poolPay-db}?authSource=admin
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - poolpay-prod-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: poolpay_web_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://adnan5000.binarybards.online/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - poolpay-prod-network

volumes:
  mongodb_data_prod:
    driver: local

networks:
  poolpay-prod-network:
    driver: bridge
