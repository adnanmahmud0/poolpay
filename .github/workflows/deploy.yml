name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # PREPARE: Deployment Metadata & Auto-Extraction of Server Credentials
  # ============================================================================
  prepare:
    name: Prepare Deployment Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      repo_owner: ${{ steps.vars.outputs.repo_owner }}
      ec2_host: ${{ steps.vars.outputs.ec2_host }}
      ec2_user: ${{ steps.vars.outputs.ec2_user }}
      ec2_ssh_key_b64: ${{ steps.vars.outputs.ec2_ssh_key_b64 }}
      has_ec2: ${{ steps.vars.outputs.has_ec2 }}
    steps:
      - name: Compute tags and parse server metadata
        id: vars
        env:
          ENV_VER: ${{ secrets.ENV_VER || secrets.ENV_FILE }}
          SEC_HOST: ${{ secrets.EC2_HOST }}
          SEC_USER: ${{ secrets.EC2_USER }}
          SEC_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "repo_owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "🏷️ Deployment Image Tag: ${TAG}"
          echo "👤 Repository Owner: ${OWNER}"

          python3 - << 'EOF'
          import os, re, base64

          env_ver = os.environ.get('ENV_VER', '').replace('\r\n', '\n').replace('\r', '\n')
          sec_host = os.environ.get('SEC_HOST', '').strip()
          sec_user = os.environ.get('SEC_USER', '').strip()
          sec_key = os.environ.get('SEC_KEY', '').strip()

          host = sec_host
          user = sec_user or 'ubuntu'
          key = sec_key

          if env_ver:
              # Extract EC2_HOST if not provided in individual secret
              if not host:
                  m_host = re.search(r'^\s*EC2_HOST\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_host:
                      host = m_host.group(1).strip()

              # Extract EC2_USER if not provided in individual secret
              if not sec_user:
                  m_user = re.search(r'^\s*EC2_USER\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_user:
                      user = m_user.group(1).strip()

              # Extract EC2_SSH_KEY if not provided in individual secret
              if not key:
                  m_b64 = re.search(r'^\s*EC2_SSH_KEY_BASE64\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_b64:
                      try:
                          key = base64.b64decode(m_b64.group(1).strip()).decode('utf-8')
                      except Exception:
                          pass

                  if not key:
                      m_key = re.search(r'(-{5}BEGIN [A-Z ]+ PRIVATE KEY-{5}[\s\S]*?-{5}END [A-Z ]+ PRIVATE KEY-{5})', env_ver)
                      if m_key:
                          raw_k = m_key.group(1).strip()
                          if '\\\\n' in raw_k:
                              raw_k = raw_k.replace('\\\\n', '\n')
                          if '\\n' in raw_k:
                              raw_k = raw_k.replace('\\n', '\n')
                          key = raw_k
                      else:
                          m_key_val = re.search(r'^\s*EC2_SSH_KEY\s*=\s*(.*)', env_ver, re.MULTILINE)
                          if m_key_val:
                              raw_k = m_key_val.group(1).strip().strip('\"\'')
                              if '\\\\n' in raw_k:
                                  raw_k = raw_k.replace('\\\\n', '\n')
                              if '\\n' in raw_k:
                                  raw_k = raw_k.replace('\\n', '\n')
                              if raw_k.startswith('LS0t'):
                                  try:
                                      raw_k = base64.b64decode(raw_k).decode('utf-8')
                                  except Exception:
                                      pass
                              key = raw_k

          # Normalize EC2 user: Ubuntu EC2 default user is ubuntu
          if user in ['poolpay', '', 'None']:
              user = 'ubuntu'

          if key:
              raw_k = key.strip()
              if '\\\\n' in raw_k:
                  raw_k = raw_k.replace('\\\\n', '\n')
              if '\\n' in raw_k:
                  raw_k = raw_k.replace('\\n', '\n')
              key = raw_k.strip() + '\n'

          has_ec2 = 'true' if (host and key) else 'false'
          b64_key = base64.b64encode(key.encode('utf-8')).decode('utf-8') if key else ''

          print(f'📡 Server Target Host: {host if host else "(Not configured yet)"}')
          print(f'👤 SSH User: {user}')
          print(f'🔑 SSH Key Configured: {has_ec2}')

          out_file = os.environ['GITHUB_OUTPUT']
          with open(out_file, 'a') as f:
              f.write(f'ec2_host={host}\n')
              f.write(f'ec2_user={user}\n')
              f.write(f'has_ec2={has_ec2}\n')
              f.write(f'ec2_ssh_key_b64={b64_key}\n')
          EOF

  # ============================================================================
  # STAGE 0: Server Bootstrap (Idempotent EC2 / VPS Setup)
  # ============================================================================
  setup-server:
    name: 0. Bootstrap Server (SSH)
    needs: prepare
    if: ${{ needs.prepare.outputs.has_ec2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH Credentials
        id: ssh_meta
        env:
          ENV_VER: ${{ secrets.ENV_VER || secrets.ENV_FILE }}
          SEC_HOST: ${{ secrets.EC2_HOST }}
          SEC_USER: ${{ secrets.EC2_USER }}
          SEC_KEY: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ needs.prepare.outputs.ec2_ssh_key_b64 }}
          PREPARE_HOST: ${{ needs.prepare.outputs.ec2_host }}
          PREPARE_USER: ${{ needs.prepare.outputs.ec2_user }}
        run: |
          python3 - << 'EOF'
          import os, re, base64, uuid

          env_ver = os.environ.get('ENV_VER', '').replace('\r\n', '\n').replace('\r', '\n')
          sec_host = os.environ.get('SEC_HOST', '').strip()
          prep_host = os.environ.get('PREPARE_HOST', '').strip()
          sec_user = os.environ.get('SEC_USER', '').strip()
          prep_user = os.environ.get('PREPARE_USER', '').strip()
          sec_key = os.environ.get('SEC_KEY', '').strip()
          key_b64 = os.environ.get('KEY_B64', '').strip()

          host = sec_host or prep_host
          user = sec_user or prep_user or 'ubuntu'
          key = sec_key

          if not key and key_b64:
              try:
                  key = base64.b64decode(key_b64).decode('utf-8').strip()
              except Exception:
                  pass

          if env_ver:
              if not host:
                  m_host = re.search(r'^\s*EC2_HOST\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_host:
                      host = m_host.group(1).strip()
              if not sec_user:
                  m_user = re.search(r'^\s*EC2_USER\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_user:
                      user = m_user.group(1).strip()
              if not key:
                  m_b64 = re.search(r'^\s*EC2_SSH_KEY_BASE64\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_b64:
                      try:
                          key = base64.b64decode(m_b64.group(1).strip()).decode('utf-8').strip()
                      except Exception:
                          pass
              if not key:
                  m_key = re.search(r'(-{5}BEGIN [A-Z ]+ PRIVATE KEY-{5}[\s\S]*?-{5}END [A-Z ]+ PRIVATE KEY-{5})', env_ver)
                  if m_key:
                      raw_k = m_key.group(1).strip()
                      if '\\\\n' in raw_k:
                          raw_k = raw_k.replace('\\\\n', '\n')
                      if '\\n' in raw_k:
                          raw_k = raw_k.replace('\\n', '\n')
                      key = raw_k
              if not key:
                  m_key_val = re.search(r'^\s*EC2_SSH_KEY\s*=\s*(.*)', env_ver, re.MULTILINE)
                  if m_key_val:
                      raw_k = m_key_val.group(1).strip().strip('\"\'')
                      if '\\\\n' in raw_k:
                          raw_k = raw_k.replace('\\\\n', '\n')
                      if '\\n' in raw_k:
                          raw_k = raw_k.replace('\\n', '\n')
                      if raw_k.startswith('LS0t'):
                          try:
                              raw_k = base64.b64decode(raw_k).decode('utf-8')
                          except Exception:
                              pass
                      key = raw_k

          # Normalize EC2 user: Ubuntu EC2 default user is ubuntu
          if user in ['poolpay', '', 'None']:
              user = 'ubuntu'

          if key:
              raw_k = key.strip()
              if '\\\\n' in raw_k:
                  raw_k = raw_k.replace('\\\\n', '\n')
              if '\\n' in raw_k:
                  raw_k = raw_k.replace('\\n', '\n')
              key = raw_k.strip() + '\n'

          print(f'Target host: {host}')
          print(f'Target user: {user}')
          print(f'Key resolved: {bool(key)} ({len(key.splitlines()) if key else 0} lines)')

          if not host or not key:
              print('❌ ERROR: Missing host or SSH key!')
              exit(1)

          delim = 'SSH_' + uuid.uuid4().hex
          out_file = os.environ['GITHUB_OUTPUT']
          with open(out_file, 'a') as f:
              f.write(f'host={host}\n')
              f.write(f'user={user}\n')
              f.write(f'key<<{delim}\n')
              f.write(f'{key}\n')
              f.write(f'{delim}\n')
          EOF

      - name: Bootstrap System Dependencies & Memory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ssh_meta.outputs.host }}
          username: ${{ steps.ssh_meta.outputs.user }}
          key: ${{ steps.ssh_meta.outputs.key }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 30m
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "🔧 [Bootstrap] Verifying server dependencies on $(hostname)..."

            # 1. Configure 2GB Swap file to prevent Out-Of-Memory (OOM) crashes
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap file..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "✅ Swap configured successfully"
            else
              echo "✅ Swapfile already active"
            fi

            # 2. Install Docker and Compose plugin if missing
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker "$USER" || sudo usermod -aG docker ubuntu || true
            fi

            # 3. Install Nginx and Certbot
            if ! command -v nginx &> /dev/null; then
              echo "Installing Nginx..."
              sudo apt-get update -y
              sudo apt-get install -y nginx
            fi

            if ! command -v certbot &> /dev/null; then
              echo "Installing Certbot..."
              sudo apt-get install -y certbot python3-certbot-nginx
            fi

            # 4. Prepare working directory & backup cron
            TARGET_DIR="$HOME/poolpay"
            mkdir -p "$TARGET_DIR/scripts"
            mkdir -p "$HOME/backups/mongodb"

            # Setup automated daily MongoDB backup cron (0 2 * * *)
            cat << 'EOF' | sudo tee "$TARGET_DIR/scripts/backup-db.sh" > /dev/null
            #!/bin/bash
            BACKUP_DIR="$HOME/backups/mongodb"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            CONTAINER_NAME="poolpay_mongodb_prod"
            DB_NAME="poolPay-db"
            RETENTION_DAYS=7
            mkdir -p "$BACKUP_DIR"
            if docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              docker exec $CONTAINER_NAME mongodump --db $DB_NAME --out /data/db/backup_temp || true
              docker cp $CONTAINER_NAME:/data/db/backup_temp/$DB_NAME "$BACKUP_DIR/mongo_backup_$TIMESTAMP" || true
              docker exec $CONTAINER_NAME rm -rf /data/db/backup_temp || true
              tar -czf "$BACKUP_DIR/mongo_backup_$TIMESTAMP.tar.gz" -C "$BACKUP_DIR" "mongo_backup_$TIMESTAMP" || true
              rm -rf "$BACKUP_DIR/mongo_backup_$TIMESTAMP"
              find "$BACKUP_DIR" -type f -name "*.tar.gz" -mtime +$RETENTION_DAYS -delete || true
            fi
            EOF
            sudo chmod +x "$TARGET_DIR/scripts/backup-db.sh"

            # Register cron idempotently
            (crontab -l 2>/dev/null | grep -v "backup-db.sh" ; echo "0 2 * * * $TARGET_DIR/scripts/backup-db.sh > /dev/null 2>&1") | crontab - || true
            echo "✅ Server bootstrap complete"

  # ============================================================================
  # STAGE 1: Monorepo Type Check
  # ============================================================================
  type-check:
    name: 1. Monorepo TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify TypeScript Across Workspaces
        run: npx turbo typecheck

  # ============================================================================
  # STAGE 2: Parallel Builds (Backend, Admin Next.js, Flutter Mobile)
  # ============================================================================
  build-backend:
    name: 2a. Build & Push Backend API Image
    needs: [prepare, type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/poolpay-backend:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/poolpay-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    name: 2b. Build & Push Admin Dashboard Image
    needs: [prepare, type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Admin Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://api.poolpay.space
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/poolpay-admin:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/poolpay-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-klx:
    name: 2d. Build KLX Luxe Plus Landing Page
    needs: [prepare, type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install Monorepo Dependencies
        run: npm ci
      - name: Build Next.js Static Export
        run: npm run build:klx
      - name: Verify SEO and Social Preview Metadata
        run: npm run test:seo --workspace=@repo/klx-luxe-plus
      - name: Upload KLX Static Site
        uses: actions/upload-artifact@v4
        with:
          name: klx-luxe-plus-site
          path: apps/klx-luxe-plus/out/
          if-no-files-found: error
          retention-days: 7

  build-mobile:
    name: 2c. Build Mobile Flutter Release APK
    needs: [prepare, type-check]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolpay-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================================
  # STAGE 3: Zero-Downtime Deployment on EC2
  # ============================================================================
  deploy:
    name: 3. Deploy to EC2 (Zero-Downtime Swap)
    needs: [prepare, setup-server, build-backend, build-admin, build-klx]
    if: ${{ needs.prepare.outputs.has_ec2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve SSH Credentials
        id: ssh_meta
        env:
          ENV_VER: ${{ secrets.ENV_VER || secrets.ENV_FILE }}
          SEC_HOST: ${{ secrets.EC2_HOST }}
          SEC_USER: ${{ secrets.EC2_USER }}
          SEC_KEY: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ needs.prepare.outputs.ec2_ssh_key_b64 }}
          PREPARE_HOST: ${{ needs.prepare.outputs.ec2_host }}
          PREPARE_USER: ${{ needs.prepare.outputs.ec2_user }}
        run: |
          python3 - << 'EOF'
          import os, re, base64, uuid

          env_ver = os.environ.get('ENV_VER', '').replace('\r\n', '\n').replace('\r', '\n')
          sec_host = os.environ.get('SEC_HOST', '').strip()
          prep_host = os.environ.get('PREPARE_HOST', '').strip()
          sec_user = os.environ.get('SEC_USER', '').strip()
          prep_user = os.environ.get('PREPARE_USER', '').strip()
          sec_key = os.environ.get('SEC_KEY', '').strip()
          key_b64 = os.environ.get('KEY_B64', '').strip()

          host = sec_host or prep_host
          user = sec_user or prep_user or 'ubuntu'
          key = sec_key

          if not key and key_b64:
              try:
                  key = base64.b64decode(key_b64).decode('utf-8').strip()
              except Exception:
                  pass

          if env_ver:
              if not host:
                  m_host = re.search(r'^\s*EC2_HOST\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_host:
                      host = m_host.group(1).strip()
              if not sec_user:
                  m_user = re.search(r'^\s*EC2_USER\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_user:
                      user = m_user.group(1).strip()
              if not key:
                  m_b64 = re.search(r'^\s*EC2_SSH_KEY_BASE64\s*=\s*[\"|\']?([^\"\'\r\n\s]+)[\"|\']?', env_ver, re.MULTILINE)
                  if m_b64:
                      try:
                          key = base64.b64decode(m_b64.group(1).strip()).decode('utf-8').strip()
                      except Exception:
                          pass
              if not key:
                  m_key = re.search(r'(-{5}BEGIN [A-Z ]+ PRIVATE KEY-{5}[\s\S]*?-{5}END [A-Z ]+ PRIVATE KEY-{5})', env_ver)
                  if m_key:
                      raw_k = m_key.group(1).strip()
                      if '\\\\n' in raw_k:
                          raw_k = raw_k.replace('\\\\n', '\n')
                      if '\\n' in raw_k:
                          raw_k = raw_k.replace('\\n', '\n')
                      key = raw_k
              if not key:
                  m_key_val = re.search(r'^\s*EC2_SSH_KEY\s*=\s*(.*)', env_ver, re.MULTILINE)
                  if m_key_val:
                      raw_k = m_key_val.group(1).strip().strip('\"\'')
                      if '\\\\n' in raw_k:
                          raw_k = raw_k.replace('\\\\n', '\n')
                      if '\\n' in raw_k:
                          raw_k = raw_k.replace('\\n', '\n')
                      if raw_k.startswith('LS0t'):
                          try:
                              raw_k = base64.b64decode(raw_k).decode('utf-8')
                          except Exception:
                              pass
                      key = raw_k

          # Normalize EC2 user: Ubuntu EC2 default user is ubuntu
          if user in ['poolpay', '', 'None']:
              user = 'ubuntu'

          if key:
              raw_k = key.strip()
              if '\\\\n' in raw_k:
                  raw_k = raw_k.replace('\\\\n', '\n')
              if '\\n' in raw_k:
                  raw_k = raw_k.replace('\\n', '\n')
              key = raw_k.strip() + '\n'

          print(f'Target host: {host}')
          print(f'Target user: {user}')
          print(f'Key resolved: {bool(key)} ({len(key.splitlines()) if key else 0} lines)')

          if not host or not key:
              print('❌ ERROR: Missing host or SSH key!')
              exit(1)

          delim = 'SSH_' + uuid.uuid4().hex
          out_file = os.environ['GITHUB_OUTPUT']
          with open(out_file, 'a') as f:
              f.write(f'host={host}\n')
              f.write(f'user={user}\n')
              f.write(f'key<<{delim}\n')
              f.write(f'{key}\n')
              f.write(f'{delim}\n')
          EOF

      - name: Generate Production Environment File
        env:
          ENV_VER: ${{ secrets.ENV_VER || secrets.ENV_FILE }}
          PORT: "5000"
          IP: "0.0.0.0"
          NODE_ENV: "production"
          AUTH_SYSTEM: "custom"
          FRONTEND_URL: "https://poolpay.space"
          BACKEND_URL: "https://api.poolpay.space"
          NEXT_PUBLIC_BASE_URL: "https://api.poolpay.space"
          NEXT_PUBLIC_API_URL: "https://api.poolpay.space/api/v1"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY || secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          SELF_PING_ENABLED: "true"
          RATE_LIMITER_ENABLED: "false"
          STORAGE_PROVIDER: "aws"
          EMAIL_PROVIDER: "resend"
          SMTP_FORM: "no-reply@poolpay.space"
          REDIS_HOST: "redis"
          REDIS_PORT: "6379"
          DISABLE_REDIS_WORKERS_IN_DEV: "false"
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: "1d"
          JWT_REFRESH_EXPIRES_IN: "30d"
          SESSION_TIMEOUT_MINUTES: "20"
          RESET_PASS_EXPIRES: "10m"
          OTP_EXPIRES: "2m"
          BCRYPT_SALT_ROUND: "10"
          EXPRESS_SESSION_SECRET: ${{ secrets.EXPRESS_SESSION_SECRET }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME || 'Super Admin' }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL || 'admin@poolpay.space' }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || 'PoolPayAdmin2026!' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: "https://api.poolpay.space/api/v1/auth/google/callback"
          GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME || 'com.poolpay.rosca' }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
          GOOGLE_PLAY_REGULAR_PRODUCT_ID: "regular_yearly_subscription"
          GOOGLE_PLAY_VIP_PRODUCT_ID: "vip_yearly_subscription"
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.poolpay.app' }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          APPLE_REGULAR_PRODUCT_ID: "regular_yearly_subscription"
          APPLE_VIP_PRODUCT_ID: "vip_yearly_subscription"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME || 'poolpay' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_TEST_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_CONNECT_WEBHOOK_SECRET }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          STRIPE_LIVE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_CONNECT_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          SMS_ENABLED: "true"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          MONGO_INITDB_ROOT_USERNAME: "admin"
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD || 'PoolPaySecurePass2026!' }}
          MONGO_INITDB_DATABASE: "poolPay-db"
          DATABASE_URL: mongodb://admin:${{ secrets.MONGO_PASSWORD || 'PoolPaySecurePass2026!' }}@mongodb:27017/poolPay-db?authSource=admin
          TEST_DATABASE_URL: mongodb://admin:${{ secrets.MONGO_PASSWORD || 'PoolPaySecurePass2026!' }}@mongodb:27017/poolPay-db?authSource=admin
          LIVE_DATABASE_URL: mongodb://admin:${{ secrets.MONGO_PASSWORD || 'PoolPaySecurePass2026!' }}@mongodb:27017/poolPay-db?authSource=admin
        run: |
          python3 - << 'EOF'
          import os, re

          env_ver = os.environ.get('ENV_VER', '').strip()

          if env_ver:
              print('🚀 Detected single secret ENV_VER / ENV_FILE! Parsing and adapting for production Docker...')
              raw_lines = env_ver.replace('\r\n', '\n').replace('\r', '\n').split('\n')
              cleaned_lines = []
              keys_present = set()
              in_multiline_skip = False

              for line in raw_lines:
                  stripped = line.strip()

                  # Skip lines inside multiline server key blocks (e.g. EC2_SSH_KEY="...")
                  if in_multiline_skip:
                      if stripped.endswith(('"', "'")) or ('END ' in stripped and 'PRIVATE KEY' in stripped):
                          in_multiline_skip = False
                      continue

                  # Keep comments and empty lines
                  if not stripped or stripped.startswith('#'):
                      cleaned_lines.append(line)
                      continue

                  if '=' in stripped:
                      key, val = stripped.split('=', 1)
                      key = key.strip()
                      val = val.strip()

                      # Exclude server connection variables from Docker .env
                      if key in ['EC2_HOST', 'EC2_USER', 'EC2_SSH_KEY', 'EC2_SSH_KEY_BASE64', 'EC2_PORT']:
                          if (val.startswith('"') and not (val.endswith('"') and len(val) > 1)) or \
                             (val.startswith("'") and not (val.endswith("'") and len(val) > 1)) or \
                             '-----BEGIN' in val:
                              in_multiline_skip = True
                          continue

                      # Strict key validation: must be a valid environment identifier
                      if not re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', key):
                          print(f'⚠️ Skipping invalid non-identifier key: {key}')
                          continue

                      # Overrides and Docker networking adaptations:
                      if key == 'NODE_ENV':
                          val = 'production'
                      elif key == 'PORT':
                          val = '5000'
                      elif key == 'IP':
                          val = '0.0.0.0'
                      elif key == 'REDIS_HOST' and (val in ['127.0.0.1', 'localhost', '']):
                          val = 'redis'
                      elif key in ['DATABASE_URL', 'TEST_DATABASE_URL', 'LIVE_DATABASE_URL']:
                          val = re.sub(r'@(localhost|127\.0\.0\.1):', '@mongodb:', val)

                      keys_present.add(key)
                      cleaned_lines.append(f'{key}={val}')

              # Resolve MongoDB root password from environment or DATABASE_URL
              mongo_pwd = os.environ.get('MONGO_INITDB_ROOT_PASSWORD', '').strip()
              if not mongo_pwd:
                  for l in cleaned_lines:
                      m_pwd = re.search(r'mongodb://[^:]+:([^@]+)@', l)
                      if m_pwd:
                          mongo_pwd = m_pwd.group(1).strip()
                          break
              if not mongo_pwd:
                  mongo_pwd = 'password123'

              # Ensure required container defaults exist
              defaults = {
                  'NODE_ENV': 'production',
                  'PORT': '5000',
                  'IP': '0.0.0.0',
                  'REDIS_HOST': 'redis',
                  'REDIS_PORT': '6379',
                  'MONGO_INITDB_ROOT_USERNAME': 'admin',
                  'MONGO_INITDB_ROOT_PASSWORD': mongo_pwd,
                  'MONGO_INITDB_DATABASE': 'poolPay-db'
              }
              for d_key, d_val in defaults.items():
                  if d_key not in keys_present:
                      cleaned_lines.append(f'{d_key}={d_val}')

              with open('.env.production', 'w') as f:
                  f.write('\n'.join(cleaned_lines) + '\n')
              print('✅ Generated .env.production from ENV_VER / ENV_FILE with full Docker compatibility!')

          else:
              print('ℹ️ ENV_VER / ENV_FILE not provided. Generating .env.production from individual secrets...')
              keys = [
                'PORT', 'IP', 'NODE_ENV', 'AUTH_SYSTEM', 'FRONTEND_URL', 'BACKEND_URL',
                'NEXT_PUBLIC_BASE_URL', 'NEXT_PUBLIC_API_URL', 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY',
                'SELF_PING_ENABLED', 'RATE_LIMITER_ENABLED', 'STORAGE_PROVIDER', 'EMAIL_PROVIDER',
                'SMTP_FORM', 'REDIS_HOST', 'REDIS_PORT', 'DISABLE_REDIS_WORKERS_IN_DEV',
                'JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET', 'JWT_ACCESS_EXPIRES_IN', 'JWT_REFRESH_EXPIRES_IN',
                'SESSION_TIMEOUT_MINUTES', 'RESET_PASS_EXPIRES', 'OTP_EXPIRES', 'BCRYPT_SALT_ROUND',
                'EXPRESS_SESSION_SECRET', 'SUPER_ADMIN_NAME', 'SUPER_ADMIN_EMAIL', 'SUPER_ADMIN_PASSWORD',
                'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GOOGLE_CALLBACK_URL',
                'GOOGLE_PLAY_PACKAGE_NAME', 'GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64',
                'GOOGLE_PLAY_REGULAR_PRODUCT_ID', 'GOOGLE_PLAY_VIP_PRODUCT_ID',
                'APPLE_ISSUER_ID', 'APPLE_KEY_ID', 'APPLE_TEAM_ID', 'APPLE_BUNDLE_ID',
                'APPLE_PRIVATE_KEY_BASE64', 'APPLE_REGULAR_PRODUCT_ID', 'APPLE_VIP_PRODUCT_ID',
                'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_REGION', 'AWS_BUCKET_NAME',
                'RESEND_API_KEY', 'STRIPE_TEST_SECRET_KEY', 'STRIPE_TEST_PUBLISHABLE_KEY',
                'STRIPE_TEST_WEBHOOK_SECRET', 'STRIPE_TEST_CONNECT_WEBHOOK_SECRET',
                'STRIPE_LIVE_SECRET_KEY', 'STRIPE_LIVE_PUBLISHABLE_KEY', 'STRIPE_LIVE_WEBHOOK_SECRET',
                'STRIPE_LIVE_CONNECT_WEBHOOK_SECRET', 'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN',
                'TWILIO_PHONE_NUMBER', 'TWILIO_MESSAGING_SERVICE_SID', 'SMS_ENABLED',
                'ENCRYPTION_KEY', 'FIREBASE_SERVICE_ACCOUNT_BASE64', 'MONGO_INITDB_ROOT_USERNAME',
                'MONGO_INITDB_ROOT_PASSWORD', 'MONGO_INITDB_DATABASE', 'DATABASE_URL',
                'TEST_DATABASE_URL', 'LIVE_DATABASE_URL'
              ]
              with open('.env.production', 'w') as f:
                for k in keys:
                  val = os.environ.get(k, '')
                  if val.strip():
                    f.write(f'{k}={val}\n')
              print('✅ Generated .env.production successfully from individual secrets')
          EOF

      - name: Download KLX Static Site
        uses: actions/download-artifact@v4
        with:
          name: klx-luxe-plus-site
          path: apps/klx-luxe-plus/out/

      - name: Securely Copy Deployment Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ssh_meta.outputs.host }}
          username: ${{ steps.ssh_meta.outputs.user }}
          key: ${{ steps.ssh_meta.outputs.key }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: ".env.production,docker-compose.prod.yml,nginx/poolpay.conf,nginx/klxluxeplus.conf,nginx/klxluxeplus-ssl.conf,deploy/deploy.sh,deploy/deploy-klx.sh,scripts/mongo-init.js,apps/klx-luxe-plus/out"
          target: "poolpay/"

      - name: Execute Zero-Downtime Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ steps.ssh_meta.outputs.host }}
          username: ${{ steps.ssh_meta.outputs.user }}
          key: ${{ steps.ssh_meta.outputs.key }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: IMAGE_TAG,REPO_OWNER,GHCR_TOKEN,GHCR_ACTOR,GITHUB_REPO
          timeout: 30m
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "🚀 Connecting to EC2 host..."
            TARGET_DIR="$HOME/poolpay"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Rename uploaded environment file to .env
            if [ -f ".env.production" ]; then
              mv -f .env.production .env
              chmod 600 .env
            fi

            # Initialize or update git repository cleanly
            if [ ! -d ".git" ]; then
              echo "📦 Initializing repository..."
              git init
              git remote add origin "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPO}.git" 2>/dev/null || git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPO}.git"
              git fetch origin main || true
              git checkout -f -B main origin/main || true
            else
              git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPO}.git"
              git fetch origin main || true
              git reset --hard origin/main || true
            fi

            # Run zero-downtime deployment script
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh "$IMAGE_TAG" "$REPO_OWNER"

  # ============================================================================
  # STAGE 4: Automated Let's Encrypt SSL & Health Verification
  # ============================================================================
  ssl-and-verify:
    name: 4. Automated SSL & Verification
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.has_ec2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Backend API Health
        run: |
          echo "🔍 Verifying https://api.poolpay.space/health..."
          for i in {1..25}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.poolpay.space/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend API is live on HTTPS and responding with HTTP 200!"
              exit 0
            fi
            echo "Attempt $i/25: HTTPS Status $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "⚠️ HTTPS verification pending or DNS propagating. Checking HTTP..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://api.poolpay.space/health || true)
          echo "HTTP (Port 80) Status: $HTTP_STATUS"

      - name: Verify Admin Dashboard
        run: |
          echo "🔍 Verifying https://admin.poolpay.space..."
          curl -s -I https://admin.poolpay.space | head -n 10 || true

      - name: Verify KLX Luxe Plus Landing Page
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://klxluxeplus.poolpay.space/ | grep -F "KLX LUXE PLUS" > /dev/null
